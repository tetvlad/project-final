services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d jira"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/jira
    volumes:
      - attachments:/opt/jirarush/attachments
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resources:/opt/jirarush/resources:ro
    depends_on:
      - app

volumes:
  db-data:
  attachments:
